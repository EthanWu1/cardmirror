name: Build macOS Desktop

on:
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS DMG + ZIP
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Bundle both macOS koffi arch binaries
        run: |
          KOFFI_VER=$(node -p "require('./apps/desktop/node_modules/koffi/package.json').version")
          npm --prefix apps/desktop install --no-save --force \
            "@koromix/koffi-darwin-x64@$KOFFI_VER" \
            "@koromix/koffi-darwin-arm64@$KOFFI_VER"

      - name: Bake optional relay defaults
        env:
          PAIRING_RELAY_URL: ${{ secrets.PAIRING_RELAY_URL }}
          PAIRING_TOKEN: ${{ secrets.PAIRING_TOKEN }}
        run: node apps/desktop/scripts/inject-relay-token.cjs

      - name: Build renderer and desktop main
        run: |
          npm --prefix apps/desktop run fetch:voice
          npm --prefix apps/desktop run build:native
          npm --prefix apps/desktop run build:renderer
          npm --prefix apps/desktop run build:main

      - name: Build Apple Silicon DMG + ZIP
        run: cd apps/desktop && npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Build Intel DMG + ZIP
        run: cd apps/desktop && npx electron-builder --mac dmg zip --x64 --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardmirror-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error
