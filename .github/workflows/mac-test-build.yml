name: macOS test build

# Manually triggered macOS desktop build for testing — produces
# arm64 and x64 `.dmg` installers plus `.zip` updater artifacts,
# and uploads them as workflow artifacts that can be downloaded
# from the run page. Unlike the
# tag-triggered `release.yml`, this one does NOT cut a GitHub
# Release or publish anything; it's a fast iteration path for
# verifying macOS-specific fixes (perf tuning, signing tweaks,
# entitlements changes, etc.) on real Apple hardware without
# going through a versioned release cycle.
#
# Run from the Actions tab → "macOS test build" → "Run workflow",
# or via `gh workflow run mac-test-build.yml`.

on:
  workflow_dispatch:

# `contents: write` so the build can publish the .dmg to a Release. Release
# assets do NOT draw on the Actions artifact-storage quota (which repeatedly
# filled up and failed the upload even though the build succeeded), and they
# give a stable download URL instead of an expiring zip.
permissions:
  contents: write

jobs:
  build:
    name: Build mac artifacts
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        # Mirrors release.yml — apps/desktop intentionally isn't in
        # the npm workspaces array because electron-builder's internal
        # install step prunes hoisted dev-deps mid-build. Install
        # separately.
        run: npm --prefix apps/desktop ci

      - name: Bundle both macOS koffi arch binaries
        # macos-latest runners are Apple Silicon, so the `ci` above only
        # installs koffi's arm64 native package (@koromix/koffi-darwin-*
        # are optional deps gated on `cpu`). electron-builder builds BOTH
        # the x64 and arm64 mac artifacts from that install, so without this
        # the x64 app ships with no koffi binary and Intel Macs hit "Cannot find the
        # native Koffi module". Force-install both arch packages at koffi's
        # own version; --force bypasses the cpu guard, --no-save keeps the
        # lockfile clean. Mirrors release.yml.
        run: |
          KOFFI_VER=$(node -p "require('./apps/desktop/node_modules/koffi/package.json').version")
          npm --prefix apps/desktop install --no-save --force \
            "@koromix/koffi-darwin-x64@$KOFFI_VER" \
            "@koromix/koffi-darwin-arm64@$KOFFI_VER"

      - name: Bake optional relay defaults
        env:
          PAIRING_RELAY_URL: ${{ secrets.PAIRING_RELAY_URL }}
          PAIRING_TOKEN: ${{ secrets.PAIRING_TOKEN }}
        run: node apps/desktop/scripts/inject-relay-token.cjs

      - name: Build desktop installer
        # `dist` runs `electron-builder` with no explicit publish
        # flag. electron-builder's default in CI is to try to
        # publish whenever the package.json has a `publish` block
        # configured — which ours does (for the tag-triggered
        # release.yml). On workflow_dispatch we don't want to
        # publish anything; pass `--publish never` to short-
        # circuit. The trailing `--` flows through the
        # `npm run` → `dist` → `electron-builder` chain because
        # the script ends with a bare `electron-builder` call.
        run: npm --prefix apps/desktop run dist -- --publish never

      - name: Publish the .dmg to the rolling "mac-dev" prerelease
        # Deliberately a RELEASE asset, not an upload-artifact: release assets
        # don't count against the Actions artifact-storage quota (which kept
        # filling up and failing the upload), they don't expire, and the
        # download URL is stable. ONE rolling tag that gets overwritten each
        # run, so this can't accumulate storage the way artifacts did.
        # Uses the preinstalled gh CLI + the automatic GITHUB_TOKEN — no PAT,
        # no third-party action.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: mac-dev
        run: |
          set -euo pipefail
          # Fails loudly (set -e) when the build produced no arm64 dmg, which is
          # what we want; head -n1 keeps a stray extra match from corrupting the
          # single-file argument below.
          DMG=$(ls apps/desktop/release/*arm64.dmg | head -n1)
          echo "Publishing $DMG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --prerelease \
              --title "macOS dev build (Apple Silicon)" \
              --notes "Latest Apple-Silicon .dmg from the \`macOS test build\` workflow. Overwritten by each run; not a versioned release."
          fi
          echo "### macOS dev build published" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
