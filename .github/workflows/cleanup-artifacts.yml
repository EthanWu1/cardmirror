name: Delete old Actions artifacts

# Frees Actions artifact STORAGE, which is what makes desktop build uploads
# fail with "Artifact storage quota has been hit" even though the build itself
# succeeded. Old desktop builds are hundreds of MB each and pile up fast.
#
# Run from the Actions tab → "Delete old Actions artifacts" → "Run workflow".
# `older_than_days: 0` (the default) deletes EVERY artifact in the repo.
# Artifacts are disposable build outputs — deleting them never touches source,
# releases, or run logs. GitHub recalculates reported storage usage every 6-12
# hours, so the billing page can still show the old number for a while after
# this frees the space; uploads generally start working well before that.

on:
  workflow_dispatch:
    inputs:
      older_than_days:
        description: 'Delete artifacts older than N days (0 = delete all)'
        required: false
        default: '0'

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete artifacts
        uses: actions/github-script@v7
        env:
          OLDER_THAN_DAYS: ${{ inputs.older_than_days }}
        with:
          script: |
            const days = Number(process.env.OLDER_THAN_DAYS || '0');
            const cutoff = days > 0 ? Date.now() - days * 24 * 60 * 60 * 1000 : null;

            let deleted = 0;
            let freedBytes = 0;
            let kept = 0;

            // Always re-request page 1: deleting shifts the pagination window, so
            // walking pages forward would silently skip artifacts.
            for (;;) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const live = data.artifacts.filter((a) => !a.expired);
              if (live.length === 0) break;

              const doomed = live.filter(
                (a) => cutoff === null || new Date(a.created_at).getTime() < cutoff,
              );
              if (doomed.length === 0) {
                kept = live.length;
                break;
              }

              // Track progress: if a whole pass deletes nothing (every call
              // failed), stop instead of re-fetching the same page forever.
              let progressed = false;
              for (const a of doomed) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: a.id,
                  });
                  deleted++;
                  freedBytes += a.size_in_bytes || 0;
                  progressed = true;
                } catch (err) {
                  core.warning(`Could not delete artifact ${a.id} (${a.name}): ${err.message}`);
                }
              }
              if (!progressed) {
                core.warning('No artifact could be deleted in this pass — stopping.');
                break;
              }
            }

            const freedMB = (freedBytes / (1024 * 1024)).toFixed(1);
            core.notice(`Deleted ${deleted} artifact(s), freeing ~${freedMB} MB.`);
            core.summary
              .addHeading('Artifact cleanup')
              .addRaw(`Deleted **${deleted}** artifact(s), freeing about **${freedMB} MB**. `)
              .addRaw(days > 0 ? `Kept ${kept} newer than ${days} day(s).` : 'Deleted all artifacts.')
              .write();
